<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ShortRead</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: #fff;
      color: #222;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ===== 卡片视口 ===== */
    .viewport {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 70px;
      overflow: hidden;
      background: #fff;
    }
    .track {
      position: relative;
      width: 100%;
      height: 100%;
      will-change: transform;
    }
    .card {
      position: absolute;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.08);
    }
    .card[data-slot="prev"] { top: -100%; }
    .card[data-slot="curr"] { top: 0; }
    .card[data-slot="next"] { top: 100%; }

    /* ===== 封面图 ===== */
    .cover {
      position: relative;
      width: 100%;
      height: 42vh;
      flex-shrink: 0;
      background: #e9e9e9; /* 图片加载灰色占位 */
      overflow: hidden;
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cover-mask {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 36%;
      background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 62%, rgba(255,255,255,1) 100%);
      pointer-events: none;
    }

    /* ===== 内容区 ===== */
    .content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 24px;
      scrollbar-width: none;
      touch-action: pan-y;
    }
    .content::-webkit-scrollbar { display: none; }
    .title {
      font-size: 26px;
      font-weight: 700;
      color: #111;
      line-height: 1.4;
      user-select: text;
      -webkit-user-select: text;
    }
    .meta {
      font-size: 14px;
      color: #777;
      margin-top: 12px;
    }
    .text {
      font-size: 18px;
      line-height: 1.8;
      color: #222;
      margin-top: 20px;
      padding-bottom: 16px;
      user-select: text;
      -webkit-user-select: text;
    }
    .text p { margin-bottom: 1em; }
    .text p:last-child { margin-bottom: 0; }

    /* ===== 底部操作栏 ===== */
    .bottombar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 70px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      z-index: 20;
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: none;
      border: none;
      outline: none;
      color: #555;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .nav-btn:active { background-color: rgba(0, 0, 0, 0.07); }
    .nav-btn svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ===== 加载 / 错误状态 ===== */
    .state {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 70px;
      background: #fff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 15;
    }
    .state.show { display: flex; }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #eee;
      border-top-color: #888;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-text { font-size: 15px; color: #777; }
    .retry-btn {
      padding: 10px 36px;
      border: 1px solid #ddd;
      border-radius: 22px;
      background: #fff;
      font-size: 15px;
      color: #333;
      cursor: pointer;
      outline: none;
      transition: background-color 0.15s ease;
    }
    .retry-btn:active { background-color: rgba(0, 0, 0, 0.07); }

    /* ===== 简易弹窗 ===== */
    .toast-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .toast-mask.show { display: flex; }
    .toast {
      background: #fff;
      border-radius: 14px;
      padding: 26px 30px;
      max-width: 78%;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
      animation: toastIn 0.18s ease-out;
    }
    @keyframes toastIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .toast-title {
      font-size: 17px;
      font-weight: 600;
      color: #111;
      margin-bottom: 10px;
    }
    .toast-msg {
      font-size: 15px;
      color: #555;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- 卡片滑动容区 -->
  <div class="viewport" id="viewport" style="visibility:hidden;">
    <div class="track" id="track">
      <article class="card" data-slot="prev"></article>
      <article class="card" data-slot="curr"></article>
      <article class="card" data-slot="next"></article>
    </div>
  </div>

  <!-- 加载状态 -->
  <div class="state show" id="state-loading">
    <div class="spinner"></div>
    <div class="state-text">正在加载每日简讯…</div>
  </div>

  <!-- 网络异常状态 -->
  <div class="state" id="state-error">
    <div class="state-text" id="error-msg">网络异常，请检查网络连接</div>
    <button class="retry-btn" id="retry-btn">重试</button>
  </div>

  <!-- 底部操作栏 -->
  <nav class="bottombar">
    <button class="nav-btn" data-action="prev">
      <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
      <span>上一篇</span>
    </button>
    <button class="nav-btn" data-action="refresh">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      <span>刷新</span>
    </button>
    <button class="nav-btn" data-action="next">
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      <span>下一篇</span>
    </button>
    <button class="nav-btn" data-action="about">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span>关于</span>
    </button>
  </nav>

  <!-- 简易弹窗 -->
  <div class="toast-mask" id="toast-mask">
    <div class="toast">
      <div class="toast-title" id="toast-title"></div>
      <div class="toast-msg" id="toast-msg"></div>
    </div>
  </div>

  <!-- 本地模拟接口（仅 localhost 生效，线上自动跳过） -->
  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
